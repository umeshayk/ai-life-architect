services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ai-life-architect-postgres
    environment:
      POSTGRES_DB: ai_life_architect
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_life_architect"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ai-life-architect-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai-life-architect-backend
    env_file:
      - ./backend/.env
    environment:
      APP_ENV: development
      APP_HOST: 0.0.0.0
      APP_PORT: 8004
      DATABASE_URL: postgresql+psycopg://postgres:root@postgres:5432/ai_life_architect
      REDIS_URL: redis://redis:6379/0
      CORS_ALLOWED_ORIGINS: http://localhost:5176,http://127.0.0.1:5176
    ports:
      - "8004:8004"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai-life-architect-worker
    command: ["celery", "-A", "app.workers.celery_app:celery_app", "worker", "--loglevel=INFO"]
    env_file:
      - ./backend/.env
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://postgres:root@postgres:5432/ai_life_architect
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai-life-architect-frontend
    env_file:
      - ./frontend/.env
    environment:
      VITE_API_BASE_URL: http://localhost:8004/api/v1
      VITE_APP_ENV: development
    ports:
      - "5176:5176"
    depends_on:
      backend:
        condition: service_started

volumes:
  postgres_data:
